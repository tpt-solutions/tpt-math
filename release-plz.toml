# release-plz: opens release pull requests with version bumps and changelog entries.
# Publishing stays off until the first release has been reviewed by hand, so that
# the 31-crate ordered publish is never a surprise.
[workspace]
publish = false
git_release_enable = false
# The simd dependencies (tpt-simd-*) are published crates on crates.io, so
# `cargo package` resolves them. Publishing stays off until the ordered first
# release; see PUBLISH_CHECKLIST.md.
