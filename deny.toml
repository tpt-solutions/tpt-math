# cargo-deny configuration — license/security/dependency hygiene.
# See https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
yanked = "deny"
# `paste` (RUSTSEC-2024-0436) is unmaintained, but it is pulled in transitively
# by `nalgebra` (via `simba`), which `statrs` depends on. There is no safe
# in-tree upgrade — the only remedy would be switching `statrs` (or `nalgebra`)
# for a fork. `paste` remains widely used and functional (its author is
# dtolnay), so we intentionally ignore this advisory rather than fail the build
# on an upstream we do not control. NOTE: our own crates no longer depend on
# `nalgebra` directly (it was replaced by `tpt-math-linalg-dense`/`faer` and
# `tpt-math-linalg-fixed`), but it still arrives transitively through `statrs`.
ignore = ["RUSTSEC-2024-0436"]

[licenses]
# All workspace crates are MIT OR Apache-2.0. The allow-list also permits the
# permissive licenses of transitive dependencies pulled in by dev/build tooling.
# NOTE: some wrap targets identified in ../registry.toml (e.g. rapier, SciRS2,
# possibly QuantRS2) are Apache-2.0-ONLY, not dual-licensed. That's fine as a
# dependency of an MIT-OR-Apache-2.0 crate, but re-check this list against
# registry.toml's [[external]] entries whenever a new one is added.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
