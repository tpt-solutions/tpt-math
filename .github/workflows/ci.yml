name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # `cargo nextest` runs the integration/unit test binaries; doctests are
      # covered separately because nextest does not execute them.
      - run: cargo nextest run --workspace --all-features
      - run: cargo test --workspace --all-features --doc

  no_std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
      # Builds the 8 `no_std = true` crates for a bare-metal target. Per ADR 0001
      # (tpt-rust-map/docs/adr/0001-no-std-via-features-not-forks.md) we build
      # only the no_std crates, not the whole workspace, so std-only crates don't
      # break the job. `xtask no-std` owns the crate/feature list.
      - run: cargo xtask no-std

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Feature-powerset CI for the four umbrella crates, so that every combination
  # of their constituent re-export features is actually compiled and tested.
  feature-powerset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - run: >
          cargo hack test --feature-powerset --all-targets
          -p tpt-math-prob -p tpt-math-autodiff -p tpt-math-optimize -p tpt-math-signal

  # Compile-only smoke test for the criterion benchmark targets. Benches are not
  # run to pass/fail in CI (timing noise); we only confirm they build.
  bench-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: >
          cargo bench --no-run
          -p tpt-math-linalg -p tpt-math-signal-fft -p tpt-math-optimize-convex -p tpt-math-exact
