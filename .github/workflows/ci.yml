name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  # NOTE: intentionally NOT `cargo build --workspace --target thumbv6m-none-eabi`.
  # Per ADR 0001 (tpt-rust-map/docs/adr/0001-no-std-via-features-not-forks.md), a
  # blind --workspace no_std build breaks the moment any std-only crate joins
  # this repo. Once the first std-only crate lands, replace the crate list
  # below with `xtask no-std-matrix` (reads the `no_std = true` entries for
  # this repo from ../tpt-rust-map/registry.toml) instead of hand-maintaining it.
  no_std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
      - run: |
          # REPLACE with explicit -p <crate> flags for this repo's no_std = true
          # crates once any crate is added.
          echo "no crates yet — nothing to build"

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v1
        with:
          command: check
