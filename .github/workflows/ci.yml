name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # `cargo nextest` runs the integration/unit test binaries; doctests are
      # covered separately because nextest does not execute them.
      - run: cargo nextest run --workspace --all-features
      - run: cargo test --workspace --all-features --doc

  no_std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
      # Builds every `no_std = true` crate for a bare-metal target. Per ADR 0001
      # (tpt-rust-map/docs/adr/0001-no-std-via-features-not-forks.md) we build
      # only the no_std crates, not the whole workspace, so std-only crates don't
      # break the job. `xtask no-std` owns the crate/feature list.
      - run: cargo xtask no-std

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Every crate compiles with each of its features on its own, and with none.
  # It catches the no-alloc build breakages that the default build hides.
  each-feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - run: cargo hack check --workspace --each-feature --no-dev-deps --exclude-features simd,simd-runtime

  # The declared rust-version (Cargo.toml `rust-version`) must build the workspace.
  # The simd features need a newer toolchain, so they are excluded here.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  # Feature-powerset CI for the four umbrella crates, so that every combination
  # of their constituent re-export features is actually compiled and tested.
  feature-powerset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - run: >
          cargo hack test --feature-powerset --all-targets
          -p tpt-math-prob -p tpt-math-autodiff -p tpt-math-optimize -p tpt-math-signal
          -p tpt-math-units-dyn -p tpt-math-numeric -p tpt-math-exact -p tpt-math-prob-monte-carlo
          -p tpt-math-signal-filter -p tpt-math-optimize-general
          --exclude-features simd,simd-runtime

  # Compile-only smoke test for the criterion benchmark targets. Benches are not
  # run to pass/fail in CI (timing noise); we only confirm they build.
  bench-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --no-run --workspace

  # Rustdoc must build with no warnings, so broken intra-doc links fail CI.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # Spell check over code, comments and docs. Configuration: _typos.toml.
  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1.51.1

  # Every `no_std = true` crate also builds for WebAssembly.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask no-std --target wasm32-unknown-unknown

  # Line coverage, uploaded as an artifact. Not a gate: it reports, it does not fail.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: lcov.info

  # Flags breaking public-API changes. Pull requests compare against the base
  # branch; pushes to master compare against the last crates.io release. Crates
  # that do not exist on the baseline are skipped by the tool.
  semver-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - name: Check against the PR base branch
        if: github.event_name == 'pull_request'
        # tpt-math and tpt-math-pde-operators have no crates.io release yet, so there is
        # no baseline to compare. Remove the excludes after their first publish.
        run: cargo semver-checks check-release --workspace --exclude tpt-math --exclude tpt-math-pde-operators --baseline-rev ${{ github.event.pull_request.base.sha }}
      - name: Check against the crates.io baseline
        if: github.event_name == 'push'
        run: cargo semver-checks check-release --workspace --exclude tpt-math --exclude tpt-math-pde-operators
