[package]
name = "tpt-math-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tpt-math-symbolic = { path = "../crates/tpt-math-symbolic" }
tpt-math-exact = { path = "../crates/tpt-math-exact" }
tpt-math-units-dyn = { path = "../crates/tpt-math-units-dyn" }
tpt-math-linalg-sparse = { path = "../crates/tpt-math-linalg-sparse" }
tpt-math-linalg-dense = { path = "../crates/tpt-math-linalg-dense" }
tpt-math-prob-core = { path = "../crates/tpt-math-prob-core" }

# Separate workspace, so the main workspace does not build the fuzzers.
[workspace]
members = ["."]

[[bin]]
name = "symbolic_simplify"
path = "fuzz_targets/symbolic_simplify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "exact_rational"
path = "fuzz_targets/exact_rational.rs"
test = false
doc = false
bench = false

[[bin]]
name = "units_dyn_parse"
path = "fuzz_targets/units_dyn_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sparse_triplets"
path = "fuzz_targets/sparse_triplets.rs"
test = false
doc = false
bench = false

[[bin]]
name = "special_functions"
path = "fuzz_targets/special_functions.rs"
test = false
doc = false
bench = false
