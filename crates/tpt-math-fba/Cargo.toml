[package]
name = "tpt-math-fba"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Flux balance analysis: a sparse bounded revised-simplex LP solver, genome-scale metabolic model loading (BiGG/COBRA JSON) and theoretical-yield calculation."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tpt-math-fba"
keywords = ["fba", "metabolic-model", "linear-programming", "simplex", "sparse"]
categories = ["mathematics", "science", "algorithms"]

[dependencies]
tpt-math-linalg-sparse = { workspace = true, features = ["std"] }
tpt-math-linalg-dense = { workspace = true, features = ["std"] }
serde_json = { workspace = true, optional = true }

[features]
default = ["json"]
# BiGG / COBRA JSON model loader.
json = ["dep:serde_json"]

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
tpt-math-optimize-general = { workspace = true }

[[bench]]
name = "fba_bench"
harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
