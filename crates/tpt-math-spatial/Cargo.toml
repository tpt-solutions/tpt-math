[package]
name = "tpt-math-spatial"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Spatial (Featherstone) kinematics for the tpt-math substrate: 6-D spatial vectors, dual quaternions and screw theory. In-house, no compliant-license wrap target. Built on tpt-math-geometry / tpt-math-linalg-fixed. No allocator."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tpt-math-spatial"
keywords = ["spatial", "featherstone", "screw", "dual-quaternion", "kinematics"]
categories = ["mathematics", "science", "no-std"]

[dependencies]
tpt-math-geometry = { workspace = true, default-features = false }
tpt-math-linalg-fixed = { workspace = true, default-features = false }
tpt-math-numeric = { workspace = true, default-features = false }

[features]
default = ["std"]
std = [
    "tpt-math-geometry/std",
    "tpt-math-linalg-fixed/std",
    "tpt-math-numeric/std",
]
alloc = [
    "tpt-math-geometry/alloc",
    "tpt-math-linalg-fixed/alloc",
    "tpt-math-numeric/alloc",
]

[lints]
workspace = true
