[package]
name = "tpt-math-optimize-convex"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Convex / QP optimization (wrap clarabel)."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tpt-math-optimize-convex"
keywords = ["convex-optimization", "qp", "solvers", "clarabel", "quadratic"]
categories = ["mathematics", "science", "algorithms"]

[dependencies]
clarabel = "0.11.1"
tpt-math-linalg = { workspace = true }

[dev-dependencies]
nalgebra = { version = "0.33.3", default-features = false, features = ["libm", "macros"] }

[features]
default = []

