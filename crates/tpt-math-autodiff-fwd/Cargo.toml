[package]
name = "tpt-math-autodiff-fwd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Forward-mode autodiff (dual numbers)."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tpt-math-autodiff-fwd"
keywords = ["autodiff", "dual-numbers", "forward-mode", "gradients", "no-std"]
categories = ["mathematics", "science", "algorithms", "no-std"]

[dependencies]
tpt-math-numeric = { workspace = true, default-features = false }

[features]
default = ["std"]
std = ["tpt-math-numeric/std"]
alloc = ["tpt-math-numeric/alloc"]


[lints]
workspace = true
