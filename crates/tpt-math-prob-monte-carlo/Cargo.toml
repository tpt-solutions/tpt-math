[package]
name = "tpt-math-prob-monte-carlo"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Monte Carlo methods."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tpt-math-prob-monte-carlo"
keywords = ["monte-carlo", "simulation", "sampling", "statistics", "numerical"]
categories = ["mathematics", "science", "algorithms", "simulation"]

[dependencies]
tpt-math-prob-core = { workspace = true, features = ["std"] }

[dependencies.rayon]
workspace = true
optional = true

[features]
default = []
# Parallel `integrate_par`. Results depend only on the seed, not the thread count.
rayon = ["dep:rayon"]


[lints]
workspace = true

[dev-dependencies]
criterion = { workspace = true }
tpt-math-prob-core = { workspace = true }

[[bench]]
name = "monte_carlo_bench"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
