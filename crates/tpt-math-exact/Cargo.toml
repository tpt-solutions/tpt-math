[package]
name = "tpt-math-exact"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Arbitrary-precision rational + interval arithmetic."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tpt-math-exact"
keywords = ["arbitrary-precision", "rational", "interval-arithmetic", "bigint", "exact"]
categories = ["mathematics", "algorithms", "science"]

[dependencies]
num-bigint = { version = "0.5.1", default-features = false }
num-rational = { version = "0.4.2", default-features = false, features = ["num-bigint"] }
num-traits = { version = "0.2.19", default-features = false, features = ["libm"] }
tpt-math-numeric = { workspace = true, default-features = false }

[features]
default = ["std"]
std = ["tpt-math-numeric/std", "num-bigint/std", "num-rational/std", "num-traits/std"]
alloc = ["tpt-math-numeric/alloc"]


[lints]
workspace = true

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "exact_bench"
harness = false
