[package]
name = "tpt-math-exact"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Arbitrary-precision rational + interval arithmetic."

[dependencies]
num-bigint = { version = "0.5.1", default-features = false, features = ["std"] }
num-rational = { version = "0.4.2", default-features = false, features = ["num-bigint", "std"] }
num-traits = { version = "0.2.19", default-features = false, features = ["libm"] }
tpt-math-numeric = { workspace = true }

[features]
default = ["std"]
std = ["tpt-math-numeric/std", "num-bigint/std", "num-rational/std", "num-traits/std"]
alloc = []

