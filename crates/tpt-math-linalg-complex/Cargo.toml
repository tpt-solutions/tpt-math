[package]
name = "tpt-math-linalg-complex"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "In-house complex-valued linear algebra: complex matrices, LU/Cholesky decompositions and a QR eigenvalue solver for EM/quantum work. Built on tpt-math-linalg-dense storage. no_std + alloc."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tpt-math-linalg-complex"
keywords = ["linear-algebra", "complex", "matrix", "eigenvalue", "no-std"]
categories = ["mathematics", "science", "algorithms", "no-std"]

[dependencies]
tpt-math-linalg-dense = { workspace = true, default-features = false }
tpt-math-numeric = { workspace = true, default-features = false }
# Optional SIMD kernels (see the `simd` feature). Needs Rust 1.95+ (edition 2024);
# the workspace MSRV (1.85) covers the default build only.
tpt-simd-blas = { version = "0.1.1", optional = true, default-features = false, features = [
    "alloc",
] }

[features]
default = ["std"]
# `std` pulls in the allocator (dynamic vectors need a heap).
std = ["tpt-math-linalg-dense/std", "tpt-math-numeric/std", "alloc"]
# Dynamic vectors/matrices always need an allocator.
alloc = ["tpt-math-linalg-dense/alloc", "tpt-math-numeric/alloc"]
# SIMD kernels for the complex LU (`getrf`/`getrs`) above a size cutoff.
simd = ["alloc", "dep:tpt-simd-blas"]
# Run-time AVX2 detection in tpt-simd-blas, and enable the dispatch.
simd-runtime = ["simd", "tpt-simd-blas/runtime-dispatch"]

[dev-dependencies]
criterion = { workspace = true }
approx = "0.5"

[[bench]]
name = "linalg_complex_bench"
harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
