[package]
name = "tpt-math-linalg-complex"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "In-house complex-valued linear algebra: complex matrices, LU/Cholesky decompositions and a QR eigenvalue solver for EM/quantum work. Built on tpt-math-linalg-dense storage. no_std + alloc."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tpt-math-linalg-complex"
keywords = ["linear-algebra", "complex", "matrix", "eigenvalue", "no-std"]
categories = ["mathematics", "science", "algorithms", "no-std"]

[dependencies]
tpt-math-linalg-dense = { workspace = true, default-features = false }
tpt-math-numeric = { workspace = true, default-features = false }
# Optional complex LU kernels (see the `simd` feature). Path dependency on the
# sibling tpt-simd repo, same layout as tpt-math-linalg-dense.
tpt-simd-blas = { path = "../../../tpt-simd/tpt-simd-blas", version = "0.1.0", optional = true, default-features = false, features = [
    "alloc",
] }

[features]
default = ["std"]
# `std` pulls in the allocator (dynamic vectors need a heap). With `simd` on, it
# also enables tpt-simd-blas run-time AVX2/FMA detection (the `?` makes that a
# no-op when `simd` is off). no_std builds keep compile-time dispatch.
std = ["tpt-math-linalg-dense/std", "tpt-math-numeric/std", "alloc", "tpt-simd-blas?/runtime-dispatch"]
# Dynamic vectors/matrices always need an allocator.
alloc = ["tpt-math-linalg-dense/alloc", "tpt-math-numeric/alloc"]
# Complex LU factorisation, `solve` and `inverse` through tpt-simd-blas `getrf`/
# `getrs` on split planes. Same pivot rule as the default path; results differ by
# rounding (tpt-simd ADR 0003, tier 2).
simd = ["alloc", "dep:tpt-simd-blas"]

[dev-dependencies]
criterion = { workspace = true }
approx = "0.5"

[[bench]]
name = "linalg_complex_bench"
harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
