[package]
name = "tpt-math-numeric"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Scalar numeric trait glue (wrap num-traits + libm)."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tpt-math-numeric"
keywords = ["numeric", "traits", "scalar", "no-std", "math"]
categories = ["mathematics", "algorithms", "no-std"]

[dependencies]
libm = { version = "0.2.16", optional = true }
num-traits = { workspace = true }

[features]
default = ["std"]
std = ["num-traits/std"]
alloc = []
libm = ["dep:libm"]


[lints]
workspace = true

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "quadrature_ode_bench"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
