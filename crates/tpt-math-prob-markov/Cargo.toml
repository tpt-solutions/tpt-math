[package]
name = "tpt-math-prob-markov"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Markov chains / HMM."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tpt-math-prob-markov"
keywords = ["markov", "hmm", "stochastic", "probability", "chains"]
categories = ["mathematics", "science", "algorithms", "simulation"]

[dependencies]
tpt-math-prob-core = { workspace = true, features = ["std"] }

[features]
default = []


[lints]
workspace = true

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "markov_bench"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
