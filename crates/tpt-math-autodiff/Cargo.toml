[package]
name = "tpt-math-autodiff"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Umbrella: re-exports fwd+rev."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tpt-math-autodiff"
keywords = ["autodiff", "gradients", "umbrella", "differentiation", "reverse-mode"]
categories = ["mathematics", "science", "algorithms"]

[dependencies]
tpt-math-autodiff-fwd = { workspace = true, optional = true }
tpt-math-autodiff-rev = { workspace = true, optional = true }

[features]
default = ["tpt-math-autodiff-fwd", "tpt-math-autodiff-rev"]
tpt-math-autodiff-fwd = ["dep:tpt-math-autodiff-fwd"]
tpt-math-autodiff-rev = ["dep:tpt-math-autodiff-rev"]


[dev-dependencies]
# Used by the cross-crate differential tests in `tests/differential.rs`.
tpt-math-symbolic = { workspace = true }
tpt-math-exact = { workspace = true }
tpt-math-linalg-dense = { workspace = true, features = ["std"] }
num-traits = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
