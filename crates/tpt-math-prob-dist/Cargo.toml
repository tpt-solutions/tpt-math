[package]
name = "tpt-math-prob-dist"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Standard distributions (wrap rand_distr)."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tpt-math-prob-dist"
keywords = ["probability", "distributions", "statistics", "random", "sampling"]
categories = ["mathematics", "science", "algorithms"]

[dependencies]
# `rand` 0.9 is the `rand_core`/`RngCore` version that `rand_distr` 0.5 is built
# against; the adapter in this crate must implement *that* `RngCore`.
rand = { workspace = true }
rand_distr = { workspace = true }
tpt-math-prob-core = { workspace = true, default-features = false }

[features]
default = ["std"]
std = ["alloc", "rand/std", "rand_distr/std", "tpt-math-prob-core/std"]
alloc = ["rand/alloc", "rand_distr/alloc", "tpt-math-prob-core/alloc"]


[lints]
workspace = true

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "density_bench"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
