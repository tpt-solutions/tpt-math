[package]
name = "tpt-math-autodiff-rev"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Reverse-mode / tape autodiff."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tpt-math-autodiff-rev"
keywords = ["autodiff", "reverse-mode", "gradients", "tape", "differentiation"]
categories = ["mathematics", "science", "algorithms"]

[dependencies]
tpt-math-autodiff-fwd = { workspace = true }

[features]
default = ["std"]
# The tape needs an allocator and `f64` transcendentals, so this crate is
# std-only for now; the feature exists for consistency with the sibling
# autodiff crates.
std = ["tpt-math-autodiff-fwd/std"]


[lints]
workspace = true
