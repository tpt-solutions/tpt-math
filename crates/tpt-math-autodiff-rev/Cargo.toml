[package]
name = "tpt-math-autodiff-rev"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Reverse-mode / tape autodiff."

[dependencies]
tpt-math-autodiff-fwd = { workspace = true }

[features]
default = ["std"]
# The tape needs an allocator and `f64` transcendentals, so this crate is
# std-only for now; the feature exists for consistency with the sibling
# autodiff crates.
std = ["tpt-math-autodiff-fwd/std"]

