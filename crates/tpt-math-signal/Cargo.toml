[package]
name = "tpt-math-signal"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Umbrella: re-exports fft+filter."

[dependencies]
tpt-math-signal-filter = { workspace = true, optional = true }
tpt-math-signal-fft = { workspace = true, optional = true }

[features]
default = ["tpt-math-signal-filter", "tpt-math-signal-fft"]
tpt-math-signal-filter = ["dep:tpt-math-signal-filter"]
tpt-math-signal-fft = ["dep:tpt-math-signal-fft"]

