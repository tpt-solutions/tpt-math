[package]
name = "tpt-math-symbolic"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Permissive-license symbolic math (CAS)."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tpt-math-symbolic"
keywords = ["symbolic", "cas", "algebra", "expression", "symbolic-math"]
categories = ["mathematics", "science", "algorithms"]

[dependencies]
num-traits = { workspace = true }
tpt-math-exact = { workspace = true, optional = true }

[features]
default = ["std"]
std = []
alloc = []
exact = ["dep:tpt-math-exact"]

[dev-dependencies]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
