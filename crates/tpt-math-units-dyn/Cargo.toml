[package]
name = "tpt-math-units-dyn"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Runtime dimension-checked units for dynamic/config payloads."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tpt-math-units-dyn"
keywords = ["units", "dimensional-analysis", "runtime", "type-safe", "physics"]
categories = ["mathematics", "science", "data-structures"]


[dependencies]
tpt-math-units = { workspace = true, features = ["std"] }
tpt-math-numeric = { workspace = true, optional = true, features = ["std"] }
tpt-math-optimize-general = { workspace = true, optional = true }
tpt-math-autodiff-rev = { workspace = true, optional = true }

[features]
default = []
# Units-aware ODE integration (`solve::dopri5_dimensioned`).
ode = ["dep:tpt-math-numeric"]
# Units-aware minimisation (`solve::minimize_dimensioned`).
optimize = ["dep:tpt-math-optimize-general", "dep:tpt-math-numeric"]
# Units-aware gradients (`solve::gradient_dimensioned`).
autodiff = ["dep:tpt-math-autodiff-rev"]


[lints]
workspace = true

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "units_dyn_bench"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
