[package]
name = "tpt-math-linalg-sparse"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "In-house sparse linear algebra (COO/CSR/CSC) with iterative solvers (CG, BiCGSTAB). No external sparse backend; complements tpt-fem-sparse."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tpt-math-linalg-sparse"
keywords = ["linear-algebra", "sparse", "matrix", "csr", "no-std"]
categories = ["mathematics", "science", "algorithms", "no-std"]

[dependencies]
tpt-math-numeric = { workspace = true, default-features = false }
tpt-math-linalg-dense = { workspace = true, default-features = false }
# Optional f32/f64 kernels for CG and BiCGSTAB. Needs Rust 1.95+ (see the
# `simd` note in tpt-math-linalg-dense); the workspace MSRV covers the default build only.
tpt-simd-sparse = { version = "0.1.1", optional = true, default-features = false }

[features]
default = ["std"]
# `std` pulls in the allocator (dynamic vectors need a heap).
std = ["alloc", "tpt-math-numeric/std", "tpt-math-linalg-dense/std"]
# All sparse containers and the dense RHS/solution type need an allocator.
alloc = ["tpt-math-numeric/alloc", "tpt-math-linalg-dense/alloc"]
# f32/f64 CG and BiCGSTAB use tpt-simd-sparse (fused vector updates, SpMV).
# Results agree with the scalar loops to rounding; the scalar path is the default.
simd = ["alloc", "dep:tpt-simd-sparse"]

[lints]
workspace = true

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "linalg_sparse_bench"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
