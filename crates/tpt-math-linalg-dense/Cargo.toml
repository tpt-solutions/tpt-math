[package]
name = "tpt-math-linalg-dense"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "In-house dense linear algebra (DVector/DMatrix, column-major Vec storage). Storage backend for tpt-math-linalg/optimize; no external linalg dependency."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tpt-math-linalg-dense"
keywords = ["linear-algebra", "matrix", "vector", "no-std"]
categories = ["mathematics", "science", "algorithms", "no-std"]

[dependencies]
tpt-math-numeric = { workspace = true, default-features = false }
# Optional SIMD backend (f32/f64 gemm, gemv, LU). Path dependency on the
# sibling tpt-simd checkout; not yet published.
tpt-simd-blas = { path = "../../../tpt-simd/tpt-simd-blas", version = "0.1.0", optional = true, default-features = false, features = ["alloc"] }

[features]
default = ["std"]
# `std` pulls in the allocator (dynamic vectors need a heap).
std = ["tpt-math-numeric/std", "alloc"]
# Dynamic vectors/matrices always need an allocator.
alloc = ["tpt-math-numeric/alloc"]
# Route f32/f64 `DMatrix * DMatrix`, `DMatrix * DVector` and f64 `solve`/`inverse`
# to tpt-simd-blas (compile-time ISA selection; see ADR 0001 in tpt-simd).
simd = ["alloc", "dep:tpt-simd-blas"]
# As `simd`, plus runtime AVX2/FMA detection (needs std; see tpt-simd ADR 0003).
simd-runtime = ["simd", "std", "tpt-simd-blas/runtime-dispatch"]

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "linalg_dense_bench"
harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
