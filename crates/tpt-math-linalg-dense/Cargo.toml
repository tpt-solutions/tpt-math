[package]
name = "tpt-math-linalg-dense"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "In-house dense linear algebra (DVector/DMatrix, column-major Vec storage). Storage backend for tpt-math-linalg/optimize; no external linalg dependency."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tpt-math-linalg-dense"
keywords = ["linear-algebra", "matrix", "vector", "no-std"]
categories = ["mathematics", "science", "algorithms", "no-std"]

[dependencies]
tpt-math-numeric = { workspace = true, default-features = false }
# Parallel f64 matrix product (`DMatrix::par_mul`). Needs std.
rayon = { workspace = true, optional = true }
# Optional SIMD kernels (see the `simd` feature). Needs Rust 1.95+ (edition 2024);
# the workspace MSRV (1.84) covers the default build only.
tpt-simd-blas = { version = "0.1.1", optional = true, default-features = false, features = [
    "alloc",
] }

[features]
default = ["std"]
# `std` pulls in the allocator (dynamic vectors need a heap).
std = ["tpt-math-numeric/std", "alloc"]
# Dynamic vectors/matrices always need an allocator.
alloc = ["tpt-math-numeric/alloc"]
# Route `DMatrix * DMatrix`, `DMatrix * DVector`, `DVector::dot` and `norm` to
# tpt-simd-blas for `f32`/`f64` (other scalar types use the generic loops).
# Off by default: results reassociate sums, so they can differ from the scalar
# loops by a few ulps (tpt-simd ADR 0003, tier 2). Adds a `T: 'static` bound to
# those operations. Enable `simd-runtime` to detect AVX2+FMA at run time.
simd = ["alloc", "dep:tpt-simd-blas"]
# Multi-threaded `DMatrix::<f64>::par_mul`. Results are bitwise equal to `*`.
rayon = ["std", "dep:rayon"]
simd-runtime = ["simd", "tpt-simd-blas/runtime-dispatch"]

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "linalg_dense_bench"
harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
features = ["alloc"]
rustdoc-args = ["--cfg", "docsrs"]
