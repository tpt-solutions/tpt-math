[package]
name = "tpt-math-optimize-general"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "General numerical optimization (wrap argmin)."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tpt-math-optimize-general"
keywords = ["optimization", "argmin", "solvers", "algorithms", "numerical"]
categories = ["mathematics", "science", "algorithms"]

[dependencies]
argmin = "0.11.0"
# `argmin` itself only pulls in the `primitives` math backend; the `nalgebra`
# `ArgminMath` impls (needed for `DVector`/`DMatrix` parameters) live behind
# this feature and must match the nalgebra version used by `tpt-math-linalg`.
argmin-math = { version = "0.5.1", default-features = false, features = [
    "primitives",
    "nalgebra_v0_33",
] }
tpt-math-linalg = { workspace = true }

[features]
default = []

