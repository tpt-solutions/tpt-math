[package]
name = "tpt-math-linalg"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Linear algebra paired with tpt-math-units for dimensional safety (in-house dense backend, via tpt-math-linalg-dense)."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tpt-math-linalg"
keywords = ["linear-algebra", "matrix", "vector", "linalg", "no-std"]
categories = ["mathematics", "science", "algorithms", "no-std"]

[dependencies]
tpt-math-linalg-dense = { workspace = true }
tpt-math-units = { workspace = true, default-features = false }
tpt-math-numeric = { workspace = true, default-features = false }

[features]
default = ["std"]
std = ["tpt-math-linalg-dense/std", "tpt-math-units/std", "tpt-math-numeric/std"]
alloc = ["tpt-math-linalg-dense/alloc", "tpt-math-units/alloc", "tpt-math-numeric/alloc"]


[lints]
workspace = true

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "linalg_bench"
harness = false
