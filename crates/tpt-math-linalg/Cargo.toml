[package]
name = "tpt-math-linalg"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Linear algebra paired with tpt-math-units for dimensional safety (wrap nalgebra)."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tpt-math-linalg"
keywords = ["linear-algebra", "matrix", "vector", "linalg", "no-std"]
categories = ["mathematics", "science", "algorithms", "no-std"]

[dependencies]
nalgebra = { version = "0.33.3", default-features = false, features = ["libm", "macros"] }
num-traits = { version = "0.2.19", default-features = false, features = ["libm"] }
tpt-math-units = { path = "../tpt-math-units", default-features = false }

[features]
default = ["std"]
std = ["nalgebra/std", "tpt-math-units/std", "num-traits/std"]
alloc = ["nalgebra/alloc", "tpt-math-units/alloc"]

