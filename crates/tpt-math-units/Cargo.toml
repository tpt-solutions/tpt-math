[package]
name = "tpt-math-units"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Compile-time typed units (wrap uom)."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tpt-math-units"
keywords = ["units", "dimensional-analysis", "types", "no-std", "physics"]
categories = ["mathematics", "science", "no-std"]

[dependencies]
uom = { workspace = true }
num-traits = { workspace = true }

[features]
default = ["std"]
std = ["num-traits/std"]
alloc = []


[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
